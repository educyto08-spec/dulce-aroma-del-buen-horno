<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DULCE AROMA DEL BUEN HORNO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Estilos específicos y profesionales para el Panel de Control */
        .admin-body {
            background-color: #f4ece1;
            padding: 30px 20px;
        }
        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 6px;
            border: 1px solid #e6d7c3;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(60,53,48,0.05);
        }
        .admin-header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #7a283c;
        }
        .btn-refresh-admin {
            background-color: #7a283c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-refresh-admin:hover {
            background-color: #5c1e2d;
        }
        .admin-tabs-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .btn-tab-admin {
            padding: 10px 25px;
            background: #e6d7c3;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-tab-admin.active {
            background: #7a283c;
            color: white;
        }
        .grid-pedidos-admin, .grid-reseñas-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .card-pedido-admin, .card-reseña-admin {
            background-color: #fff;
            border: 1px solid #e6d7c3;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(60,53,48,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .card-pedido-admin.nuevo-pedido {
            border-top: 5px solid #16a34a;
        }
        .card-reseña-admin {
            border-top: 5px solid #f1c40f;
        }
        .admin-pedido-meta, .admin-reseña-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #7c726a;
            margin-bottom: 12px;
            border-bottom: 1px solid #f5ebe0;
            padding-bottom: 6px;
        }
        .admin-cliente-info {
            background-color: #faf6f0;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
        .admin-cliente-info p {
            margin: 4px 0;
        }
        .admin-productos-list {
            margin: 10px 0;
            padding-left: 18px;
            font-size: 0.9rem;
            flex-grow: 1;
            color: #333;
        }
        .admin-productos-list li {
            margin-bottom: 6px;
        }
        .admin-pedido-entrega {
            font-size: 0.85rem;
            background-color: #eef9f1;
            color: #155724;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            border-left: 3px solid #28a745;
        }
        .admin-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #f5ebe0;
        }
        .admin-total-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }
        .selector-estado-pedido {
            padding: 5px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fdfdfd;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-eliminar-reseña {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-eliminar-reseña:hover {
            background: #c0392b;
        }
        .text-muted {
            color: #7c726a;
            font-style: italic;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1><i class="fa-solid fa-screwdriver-wrench"></i> Panel del Horno: Backoffice General</h1>
                <p style="margin: 4px 0 0 0; font-size: 0.85rem; color: #7c726a;">Monitoreo de comandas entrantes y moderación del catálogo y reseñas públicas.</p>
            </div>
            <button class="btn-refresh-admin" onclick="actualizarVistaActivaAdmin()">
                <i class="fa-solid fa-rotate"></i> Sincronizar Nube
            </button>
        </div>

        <div class="admin-tabs-bar">
            <button id="tabPedidos" class="btn-tab-admin active" onclick="cambiarSeccionAdmin('pedidos')"><i class="fa-solid fa-receipt"></i> Pedidos Recibidos</button>
            <button id="tabReseñas" class="btn-tab-admin" onclick="cambiarSeccionAdmin('reseñas')"><i class="fa-solid fa-star"></i> Moderar Opiniones</button>
            <button class="btn-tab-admin" onclick="regresarAlSitioPublico()" style="margin-left: auto; background: #7c726a; color: white;"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</button>
        </div>

        <div id="seccionPedidosAdmin">
            <div id="contenedorPedidosAdmin" class="grid-pedidos-admin">
                <p class="text-muted" style="grid-column: 1/-1;">🔄 Conectando con el horno de Firestore...</p>
            </div>
        </div>

        <div id="seccionReseñasAdmin" style="display: none;">
            <div id="contenedorReseñasAdmin" class="grid-reseñas-admin">
                <p class="text-muted" style="grid-column: 1/-1;">🔄 Cargando opiniones del servidor...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/admin-script.js"></script>
</body>
</html>
