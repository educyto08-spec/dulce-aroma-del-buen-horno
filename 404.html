<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Dulce Aroma del Buen Horno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --cafe: #7b5533;
            --cafe-oscuro: #4a3220;
            --crema: #faf5eb;
            --borde: #e5d5c0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #f5ede0 0%, #ede4d4 100%);
            color: #3d2914; padding: 24px;
        }
        .card {
            background: #fdfaf4;
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 48px 40px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(61, 41, 20, 0.08);
        }
        .icono { font-size: 3rem; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--cafe); }
        p { margin: 0 0 24px; line-height: 1.6; color: #8b7355; font-size: 0.95rem; }
        a {
            display: inline-block;
            background: var(--cafe);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        a:hover { background: var(--cafe-oscuro); }
        .codigo { font-size: 4rem; font-weight: 800; color: var(--cafe); opacity: 0.25; line-height: 1; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="codigo">404</div>
        <div class="icono" aria-hidden="true">🥖</div>
        <h1>Esta página no está en el horno</h1>
        <p>La ruta que buscas no existe o fue movida. Vuelve a nuestra tienda y elige tu pan favorito.</p>
        <a href="index.html">Volver al catálogo</a>
    </div>
</body>
</html>
